[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chanomhub-sdk"
version = "0.1.0"
description = "Chanomhub Python SDK"
authors = [
    {name = "Chanomhub", email = "hello@chanomhub.com"}
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5"
]
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]
